name: Seed staging catalogue

# Imports popular movies and TV shows from TMDB and trending books from Open
# Library into the staging database, then refreshes the home page's "New and
# trending" list (TMDB now playing and this week's trending, Open Library's
# weekly trending books). Titles already there are skipped, so it is safe to
# run again. Runs daily for the trending list only, or by hand (Actions →
# Seed staging catalogue → Run workflow) for everything. It uses free APIs and
# free GitHub Actions minutes. There is deliberately no production version yet.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full: popular lists and trending. trending: the trending list only."
        type: choice
        options: [full, trending]
        default: full
      movies:
        description: Popular movies to add
        default: "60"
      tv:
        description: Popular TV shows to add
        default: "40"
      books:
        description: Trending books to add
        default: "40"

permissions:
  contents: read

concurrency:
  group: seed-staging
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.ismymediaai.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seed the catalogue
        run: npm run seed:catalogue
        env:
          SUPABASE_URL: https://raytxskehcrnbvyeebbf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          SEED_MOVIES: ${{ inputs.movies }}
          SEED_TV: ${{ inputs.tv }}
          SEED_BOOKS: ${{ inputs.books }}
          SEED_MODE: ${{ github.event_name == 'schedule' && 'trending' || inputs.mode }}
