name: CI

# Runs on every PR. deploy-staging.yml calls it again on each merge to main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # Only the services the tests need; keeps CI start-up fast.
  SUPABASE_EXCLUDE: studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor

jobs:
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (80% coverage on lib/services and lib/validation)
        run: npm run test:unit
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Database policies (pgTAP) and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Same as the worker job: keep outgoing connections off 54321-54324.
      - name: Keep outgoing connections off Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="55000 65000"
      - name: Start local Supabase and apply migrations
        # No mail catcher here: policy tests send no email, and its port has
        # collided with something already on the runner.
        run: npx supabase start -x "$SUPABASE_EXCLUDE,mailpit"
      - name: pgTAP policy tests
        run: npx supabase test db
      - name: Generated types match the schema
        run: |
          npm run db:types
          git diff --exit-code -- lib/database.types.ts || {
            echo "::error::lib/database.types.ts is out of date. Run 'npm run db:types' and commit the result."
            exit 1
          }

  app:
    name: Worker build, integration and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      # Supabase's local ports (54321-54324) sit inside Linux's default
      # ephemeral range, so an outgoing connection on the runner (image pulls)
      # can hold 54324 and the mail catcher fails to bind. Move the ephemeral
      # range above them.
      - name: Keep outgoing connections off Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="55000 65000"
      - name: Start local Supabase and apply migrations
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: Build the Cloudflare Worker
        run: npm run build:worker
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Render the sign-in buttons so the tests and the accessibility scan cover them.
          NEXT_PUBLIC_AUTH_PROVIDERS: google,github
          # A dummy key so the consent banner renders; PostHog rejects it.
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_dummy
      - name: Start the Worker locally (workerd)
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health > /dev/null && exit 0
            sleep 2
          done
          cat wrangler.log
          exit 1
      - name: Integration tests
        run: npm run test:integration
        env:
          APP_URL: http://127.0.0.1:8787
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test --trace retain-on-failure
      - name: Worker log
        if: failure()
        run: cat wrangler.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Complements CodeQL (codeql.yml) with React/Next.js rules; fails on any finding.
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Semgrep
        run: >
          semgrep scan --error --metrics off
          --config p/javascript --config p/typescript --config p/react
          --config p/nextjs --config p/github-actions
          --exclude lib/database.types.ts
        env:
          SEMGREP_SEND_METRICS: "off"
