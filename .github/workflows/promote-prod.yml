name: Promote to production

# Manual only. The `production` GitHub Environment requires approval, and the
# commit must carry a passing "staging-verified" status from deploy-staging.yml.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to promote (defaults to the latest commit on main)"
        required: false
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve commit and check it passed staging
        id: resolve
        run: |
          sha="${INPUT_SHA:-}"
          if [ -z "$sha" ]; then
            sha=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r .sha)
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Give a full 40-character commit SHA."
            exit 1
          fi
          state=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" \
            | jq -r '[.[] | select(.context == "staging-verified")][0].state // "missing"')
          if [ "$state" != "success" ]; then
            echo "::error::Commit $sha is not staging-verified (status: $state). Deploy it to staging first."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha" >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://ismymediaai.com
    env:
      SUPABASE_PROJECT_REF: ifcwdqxukmauazzrmknf
      SITE_URL: https://ismymediaai.com
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Apply database migrations to production
        # CLI 3 targets the local stack unless --remote is given. The access
        # token is enough to write migrations; no database password needed.
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build the Worker for production
        run: npm run build:worker
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # Optional per-environment variables; unset means no bot check / email only.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          NEXT_PUBLIC_BUILD_SHA: ${{ env.SHA }}

      - name: Deploy the production Worker
        run: |
          umask 077
          jq -n \
            --arg SUPABASE_SECRET_KEY "$SUPABASE_SECRET_KEY" \
            --arg TMDB_API_TOKEN "$TMDB_API_TOKEN" \
            --arg TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY" \
            '{SUPABASE_SECRET_KEY: $SUPABASE_SECRET_KEY, TMDB_API_TOKEN: $TMDB_API_TOKEN, TURNSTILE_SECRET_KEY: $TURNSTILE_SECRET_KEY}
             | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          npx opennextjs-cloudflare deploy --env production -- --secrets-file "$RUNNER_TEMP/secrets.json" --message "promote $SHA"
          rm -f "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Wait for the new version to serve
        id: wait
        run: |
          for i in $(seq 1 30); do
            commit=$(curl -fsS "$SITE_URL/api/health" | jq -r .commit || true)
            [ "$commit" = "$SHA" ] && exit 0
            sleep 5
          done
          echo "::error::production did not report commit $SHA"
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests against production
        id: smoke
        run: npm run test:smoke
        env:
          BASE_URL: ${{ env.SITE_URL }}

      # Migrations are forward-only (expand then contract), so the previous
      # Worker version keeps working against the new schema.
      - name: Roll back the Worker if anything after deploy failed
        if: failure() && steps.wait.conclusion != 'skipped'
        run: |
          npx wrangler rollback --env production --yes --message "Automatic rollback: smoke tests failed for $SHA"
          echo "::error::Production smoke tests failed for $SHA. Rolled back to the previous Worker version."
          echo "### Rolled back: smoke tests failed for $SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
