name: Nightly

# Trust level updates run inside Postgres (pg_cron, see supabase/migrations).
# This workflow checks staging end to end and scans dependencies.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full end-to-end suite against staging
        run: npx playwright test
        env:
          BASE_URL: https://staging.ismymediaai.com

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high --omit=dev
